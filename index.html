<!DOCTYPE html>
<html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>會勘紀錄表編輯器 V1.3</title>
<style>[hidden]{display:none!important}
:root{font-family:"Segoe UI","Microsoft JhengHei",sans-serif;color:#243443;background:#e8eef2;font-size:20px;--line:#d3dde3;--blue:#176a70;--soft:#dceeec;--orange:#d9822b;--save:#1f6fb5}
*{box-sizing:border-box}
body{margin:0;background:#e8eef2}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;color:inherit;border-radius:7px;padding:5px 12px;transition:background .15s,border-color .15s}
button:hover{background:#e4edf0}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:#10565b}
button.save{background:var(--save);border-color:var(--save);color:#fff}
button.save:hover{background:#185c97}
button.accent{background:var(--orange);border-color:var(--orange);color:#fff}
button.accent:hover{background:#c06f1f}
button.danger{color:#ad3d40}
button.small{font-size:16px;padding:3px 8px}
h1{font-size:28px;margin:0;letter-spacing:.5px;white-space:nowrap}
h3{margin:0;font-size:19px}
.version{font-size:15px;background:var(--soft);color:var(--blue);border-radius:4px;padding:2px 6px;margin-left:8px;vertical-align:middle}
.eyebrow{font-size:16px;color:#71818c;letter-spacing:1px}
.count{font-size:16px;color:#71818c;font-weight:400}
.hint{font-size:15px;color:#71818c}
:where(input:not([type=checkbox]):not([type=file]),select,textarea){display:block;width:100%;border:1px solid #c4d0d8;border-radius:6px;background:#fff;padding:5px 7px;color:#263947;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:#418e94;box-shadow:0 0 0 3px #176a7018}
input[readonly].auto{background:#f1f6f7;color:#3d6b70;font-weight:600}
textarea{resize:vertical;line-height:1.55}
input[type=checkbox]{accent-color:var(--blue);width:16px;height:16px;margin:0}
.toggle{display:inline-flex;align-items:center;gap:5px;font-size:16px;color:#566a76;font-weight:400;cursor:pointer;white-space:nowrap}

/* ── 頁首 ── */
header{background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.header-document{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.header-field{display:flex;flex-direction:column;font-size:13px;color:#6b7d88;gap:1px}
.header-field input{font-size:16px;padding:3px 7px;width:150px}
#headerDate{width:142px}
#placeSyncBtn{font-size:16px;padding:6px 11px}
.header-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.header-group{display:flex;gap:6px;align-items:center;padding-left:8px;border-left:1px solid var(--line)}
.header-group:first-child{border-left:0;padding-left:0}
.header-actions{gap:5px}
.header-group{gap:5px;padding-left:6px}
.header-actions button{font-size:15.5px;padding:5px 9px}
h1{font-size:25px}
#mobileMore{display:none}
button.cloud-on{border-color:#5aa39b;background:#eef8f6}

/* ── 版面 ── */
.workspace{display:grid;grid-template-columns:330px minmax(0,1fr)}
aside{padding:12px 13px;background:#eef3f6;border-right:1px solid var(--line);overflow:auto}
.main-col{display:grid;grid-template-rows:minmax(150px,1fr) 10px var(--preview-h,46%);min-height:0}
.editor{background:#fff;overflow:auto;padding:14px 24px;min-height:0}
.preview-pane{overflow:auto;padding:10px 14px;background:#dfe7ea;min-height:0}
.splitter{position:relative;background:#e4ecee;cursor:row-resize;touch-action:none;outline:none}
.splitter:before{content:'';position:absolute;left:calc(50% - 32px);top:3px;width:64px;height:4px;border-radius:3px;background:#a4b9be}
.splitter:hover,.splitter:focus-visible{background:#c6e3e0}
body.preview-hidden .main-col{grid-template-rows:1fr 0 0}
body.preview-hidden .preview-pane,body.preview-hidden .splitter{display:none}
body.preview-wide .main-col{grid-template-rows:minmax(90px,10%) 10px 1fr}
body.preview-full .preview-pane{position:fixed;inset:0;z-index:40;padding:14px 22px}
@media(min-width:1001px){
  body{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  .workspace{flex:1;min-height:0}
  aside{min-height:0}
}

/* ── 側欄：行程資訊區 ── */
.sidebar-info-section{border:1px solid var(--line);border-radius:9px;margin-bottom:10px;overflow:hidden;background:#fff}
.itinerary-info{background:#e4f0ee;padding:9px;border-color:#a9cfc8}
.section-title{display:flex;align-items:baseline;gap:6px;cursor:pointer;list-style:none}
.section-title::-webkit-details-marker{display:none}
.section-title:before{content:'▾';color:#5f7d78;font-size:16px}
details:not([open])>.section-title:before{content:'▸'}
.section-title .label{font-size:20px;font-weight:600;color:#365952}
.stop{display:block;width:100%;padding:6px 7px;margin:7px 0;border:1px solid #c3d6d2;border-radius:8px;background:#fff;cursor:pointer}
.stop.selected,.itinerary-list-item.selected{border-color:#438c85;box-shadow:0 0 0 1px #438c8533;background:#e8f8f3}
.stop .top{font-size:15px;color:#71818c;display:flex;justify-content:space-between;gap:6px;margin-bottom:3px}
.itinerary-list-item{border:1px solid #c3d6d2;border-radius:8px;background:#fff;margin:0;padding:5px 7px;cursor:pointer}
.itinerary-list-item:hover{border-color:#80aaa3}

.itinerary-first-row{display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:grab}
.itinerary-code{font-size:15px;color:#637982;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.itinerary-move{display:flex;gap:3px;flex:none}
.itinerary-move button{font-size:15px;padding:0 6px;line-height:1.45;min-width:25px}
.itinerary-place-time{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:5px;align-items:center;margin-top:4px}
.sidebar-place-input{font-size:17px;font-weight:600;padding:2px 5px}
.sidebar-time-input{font-size:17px;text-align:center;padding:2px 3px;letter-spacing:-.3px}
.sidebar-time-input.warn{border-color:#d9822b;background:#fff6ea}
.itinerary-list-item.dragging{opacity:.45}
.itinerary-list-item.drop-before{box-shadow:0 -3px 0 #176a70}
.itinerary-list-item.drop-after{box-shadow:0 3px 0 #176a70}
.leg-chip{display:flex;align-items:center;gap:5px;margin:4px 0 4px 14px;padding:2px 8px;font-size:15px;color:#4f6a66;border-left:2px dashed #8fb8b1}
.leg-chip select{width:auto;font-size:15px;padding:1px 3px}
.leg-chip input{width:52px;font-size:15px;padding:1px 4px;text-align:center}
.leg-chip.rail{color:#8a6414;border-left-color:#d1aa52}
.leg-chip.air{color:#46589a;border-left-color:#8d9ad0}
.leg-chip.return{flex-wrap:wrap;margin-top:6px}
.leg-chip.return .return-place{width:120px;text-align:left}
.leg-chip .return-time{font-weight:700;color:#176a70}
.add-panel{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed #a9cfc8}
.add-panel button{font-size:15.5px;flex:1;white-space:nowrap;padding:5px 6px}
.sidebar-section-button{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;border-radius:0;padding:9px 11px;font-size:19px;font-weight:600}
.pending-info .sidebar-section-button{background:#fff2e2;color:#8a5a1d}
.pending-status{font-size:14px;font-weight:600;padding:1px 8px;border-radius:999px;background:#fde0c2;color:#8a4b12}
.pending-status.done{background:#dff1e7;color:#2d6b48}
.tool-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.side-tools{margin-top:6px}
.side-tools button{font-size:15px}

/* ── 編輯區 ── */
.editor-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.editor-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px;align-items:start}
.editor-main,.editor-side{display:grid;gap:10px;min-width:0}
.editor-main>.basic-single-row{width:100%;margin-bottom:0}
.block{border:1px solid #dae1e6;border-radius:10px;padding:10px 11px;background:#edf4f6;min-width:0}
.block-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:7px;flex-wrap:wrap}
.block.basic-block,.basic-single-row{background:#e5edf9;border-color:#d6e0f0}
.block.time-section{background:#e5edf9;border-color:#d6e0f0}
.block.route-section{background:#e3f3f0;border-color:#d2e8e0}
.block.unit-section{background:#f5f0e2;border-color:#e9dfcd}
.block.contact-section{background:#e2ecff;border-color:#d3dff3}
.block.special{background:#fff6df;border-color:#ecd9a4}
.basic-single-row{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,.7fr) minmax(0,1.3fr);gap:10px;border:1px solid #d6e0f0;border-radius:10px;padding:10px 11px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:15px;color:#566a76;display:flex;align-items:center;justify-content:space-between;gap:6px;white-space:nowrap}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
.grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:8px}
.pair{display:flex;align-items:center;gap:4px}
.pair em{font-style:normal;color:#71818c}
.tip{padding:6px 9px;background:#ffffffb0;border-left:3px solid #97b3c8;font-size:16px;color:#516879;line-height:1.6;margin-top:4px}
.tip.warn{border-left-color:#d9822b;background:#fff6ea;color:#8a5a1d}
.tip button{margin-left:6px}
.special-box{border:1px dashed #d4ad52;background:#fffbef;border-radius:8px;padding:8px;margin-bottom:8px}
.prep-row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.chip-grid{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #c9bea3;background:#fff;border-radius:999px;padding:3px 11px;font-size:16px;color:#5c5240}
.chip.on{background:#8a6b2c;border-color:#7a5d22;color:#fff}
.chip .order{display:inline-block;min-width:1.2em;margin-right:3px;font-size:13px;opacity:.85}
.contact-section .chip{border-color:#aebfdf;color:#3e5378}
.contact-section .chip.on{background:#3f62a8;border-color:#35558f;color:#fff}
.add-inline{margin-top:7px}
.add-inline input{font-size:16px}
.sub-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 6px;font-size:17px;font-weight:600;color:#3b4f62}
.item-list-title{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.item-list-title>h3{margin-right:auto}
.phrase-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:7px}
.chip-btn{font-size:14.5px;padding:2px 8px;border-radius:6px;border:1px dashed #b8ab8b;background:#fffdf7;color:#6a5a36}
.chip-btn:hover{background:#fff3d6}
.chip-btn.contact{border-color:#7fb08a;color:#2f6b3c;background:#f4fbf5}
.contact-section .chip-btn{border-color:#9db2d8;color:#3e5378;background:#f7f9ff}
.line-row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:5px;align-items:start;margin-bottom:5px}
.line-kind{font-size:15px;padding:4px 0;font-weight:700;border-radius:6px;color:#475a66;background:#fff}
.line-row.kind-step .line-kind{color:#24323c}
.line-row.kind-note .line-kind{color:#1847b8}
.line-row.kind-contact .line-kind{color:#2c6b38;font-size:13.5px}
.line-row.kind-pre .line-kind{color:#71818c;font-size:13.5px}
.line-row textarea{min-height:36px;height:36px;padding:5px 7px;line-height:1.45;resize:none;overflow:hidden;font-size:17px}
.line-row.tone-red textarea{color:#c40000}
.line-row.tone-blue textarea{color:#1d3fb0}
.line-row.tone-green textarea{color:#25652f}
.line-row.bold textarea{font-weight:700}
.line-tools{display:flex;gap:3px;flex-wrap:nowrap}
.line-tools button{font-size:14px;padding:2px 6px;min-width:26px}
.tone-btn{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.tone-dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:#222;flex:none}
.tone-dot.red{background:#e00}.tone-dot.blue{background:#1d3fd0}.tone-dot.green{background:#1d7a2f}.tone-dot.black{background:#222}
.bold-btn.on{background:#3b4f62;color:#fff;border-color:#3b4f62}
.empty-hint{font-size:15px;color:#7d8991;margin:4px 0}
.deputy{margin-top:8px;white-space:normal}

/* ── 預覽 ── */
.preview-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.preview-toolbar strong{font-size:19px;margin-right:4px}
.preview-toolbar select{width:auto;font-size:16px;padding:2px 5px}
.preview-toolbar .spacer{flex:1}
.preview-body{display:flex;gap:12px;align-items:flex-start}
.paper-wrap{flex:1;min-width:0;overflow:hidden}
.validation{flex:0 0 300px;background:#fff4d9;border:1px solid #ead7a9;border-radius:7px;padding:8px 10px;font-size:16px;color:#896425;line-height:1.55;max-height:100%;overflow:auto}
.validation strong{display:block;font-size:18px;margin-bottom:3px}
.validation ul{padding-left:20px;margin:3px 0}
.validation.ok{background:#e7f5ec;border-color:#bfdcc9;color:#2d6b48}
.paper{width:760px;background:#fff;box-shadow:0 3px 16px #182d3b12;padding:18px;color:#000;font-family:"DFKai-SB","BiauKai","標楷體","Kaiti TC","Noto Serif CJK TC",serif;transform-origin:top left}
.survey{width:100%;border-collapse:collapse;table-layout:fixed;border:4px double #000;font-size:16.6px}
.survey td,.survey th{border:1px solid #000;padding:1px 3px;vertical-align:middle;overflow-wrap:anywhere;font-weight:400}
.survey th{font-weight:700;text-align:center;line-height:20.8px}
.survey p{margin:0;letter-spacing:-1.2px;white-space:pre-wrap}
.survey .title-row p{letter-spacing:0}
.survey .jc-center{text-align:center}
.survey .jc-both{text-align:justify}
.survey .jc-left{text-align:left}
.survey p.hang{padding-left:1em;text-indent:-1em}
.survey .b{font-weight:700}
.survey .c-blue{color:#0000ff}
.survey .c-red{color:#ee0000}
.survey .c-green{color:#006600}
.survey td.shade{background:#f2f2f2}
.survey tr[data-id]{cursor:pointer}
.survey tr.selected-row td{background:#dff0ee}
.survey tr.selected-row td.shade{background:#d4e9e6}
.survey tr:hover td{outline:0}

/* ── 對話框 ── */
dialog{border:1px solid var(--line);border-radius:12px;max-width:560px;width:92vw;padding:16px;box-shadow:0 20px 80px #0003;color:#243443}
dialog::backdrop{background:#1c303c55}
dialog h2{margin:0 0 8px;font-size:24px}
dialog p{font-size:18px;line-height:1.7;color:#566b78;white-space:pre-line}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.db-dialog{max-width:1180px;width:96vw;height:min(880px,94vh);display:none;flex-direction:column}
.db-dialog[open]{display:flex}
.db-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.db-header h2{margin:0}
.db-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.db-tabs button{font-size:18px}
.db-tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
#dbContent{flex:1;min-height:0;overflow:auto}
.db-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;height:100%}
.db-list{background:#eef3f6;border-radius:10px;padding:10px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.db-place{text-align:left;font-size:17px;padding:6px 9px}
.db-place small{display:block;font-size:13px;color:#7d8991}
.db-place.active{border-color:#438c85;background:#e8f8f3}

.db-place-group{margin-top:10px}
.db-place-group-title{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600;color:#526e78;border-bottom:1px solid #cbd8de;padding:4px 0;margin-bottom:5px;cursor:pointer;list-style:none}
.db-place-group-title::-webkit-details-marker{display:none}
.db-place-group-title:before{content:'▾';font-size:13px}
.db-place-group:not([open])>.db-place-group-title:before{content:'▸'}
.db-place-group-title>span{margin-left:auto;font-weight:400}
.db-transport-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.db-transport-grid>.db-transport-place{margin:0;min-height:40px;padding:5px 3px;text-align:center;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-pager{justify-content:space-between;margin-top:auto}

.db-edit{overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px}
.db-edit textarea{min-height:110px}
.db-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.db-grid textarea{min-height:190px}
.db-save-row{display:flex;justify-content:flex-end;gap:8px}
.db-footer{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.db-status{font-size:15px;color:#566b78}
.cloud-sec{border:1px solid var(--line);border-radius:9px;padding:10px;margin:10px 0}
.cloud-sec h3,.cloud-sec summary{font-size:18px;font-weight:600;cursor:pointer}
.cloud-hint{font-size:15px;color:#71818c;margin:6px 0}
.cloud-field{display:flex;flex-direction:column;gap:3px;font-size:15px;margin:7px 0}
.cloud-list{max-height:260px;overflow:auto;margin-top:8px}
.cloud-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cloud-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cloud-size{font-size:14px;color:#7d8991}
.cloud-empty{font-size:15px;color:#7d8991;padding:6px 0}
#cloudDialog{max-width:640px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#203a43;color:#fff;padding:8px 20px;border-radius:9px;box-shadow:0 4px 25px #0002;max-width:90vw;z-index:60;font-size:17px}
.mobile-nav,.mobile-bottom{display:none}

/* ── 中尺寸 ── */
@media(max-width:1400px){.editor-columns{grid-template-columns:1fr}}
@media(min-width:1401px){.basic-single-row{width:calc((100% - 12px) / 2.15)}}
@media(max-width:1000px){
  .workspace{grid-template-columns:290px minmax(0,1fr)}
  .main-col{display:block}
  .splitter{display:none}
  .editor{padding:12px}
  .preview-body{flex-direction:column;align-items:stretch}
  .validation{flex:none;width:100%}
}

/* 行程卡片比照道路表：序號與縣市在上，場所與抵離時間同列。 */
.itinerary-info{background:#fff;border-color:#4fae94;box-shadow:0 4px 14px -4px #4fae9480}
.section-title .label{font-size:17px;color:#2f4a55}
.compact-itinerary{padding:5px 7px;margin:6px 0;box-shadow:0 1px 3px #24344305}
.itinerary-code{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
.itinerary-code>select{font-size:15px;width:105px;padding:0 3px}
.itinerary-place-time{grid-template-columns:minmax(0,1fr) 112px;min-height:34px}
.sidebar-place-name{width:100%;font-size:18px;font-weight:600;padding:2px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent}
.sidebar-place-name:hover{background:#dceeec}
.sidebar-place-input,.sidebar-time-input{font-size:18px;padding:2px 4px;line-height:1.5}
.rail-seating{border:1px solid #d4ad52;border-radius:8px;background:#fffbef;padding:10px;margin-bottom:12px}
.rail-fixed{display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 8px;background:#fff;border-radius:6px;font-size:17px;margin-bottom:8px}
.rail-fixed-person{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.rail-fixed-person>.rail-seat-number{display:inline-block;width:58px;min-width:0;padding:3px 4px;font-size:16px}
.rail-seat-note{grid-column:2;font-size:17px;padding:4px 7px}

<script id="embeddedConfig" type="application/json">{}</script>
<script>
'use strict';
// 會勘紀錄表編輯器：沿用道路表編輯器的架構（左側行程、分色編輯區、可點選回編輯的預覽、常用資料庫、JSON／雲端、Word 輸出）。
const CLEAN_DOCUMENT=document.documentElement.cloneNode(true);
const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>globalThis.crypto?.randomUUID?.()||'r'+Date.now().toString(36)+Math.random().toString(36).slice(2);
const pad2=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`};
const clone=v=>JSON.parse(JSON.stringify(v));
const normDigits=v=>String(v??'').replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0));
const canon=v=>String(v??'').replace(/\s/g,'').replace(/台/g,'臺');

// 依開啟的 HTML 檔名同步版本號（例如「會勘紀錄表編輯器V1.1.html」）；無法辨識時用預設值。
const APP_VERSION=(()=>{let f='';try{f=decodeURIComponent(location.pathname.split('/').pop()||'')}catch{}const m=f.match(/V(\d+(?:\.\d+)*)/i);return m?'V'+m[1]:'V1.3'})();
document.title='會勘紀錄表編輯器 '+APP_VERSION;
document.querySelector('header h1 .version').textContent=APP_VERSION;

const EMBEDDED=(()=>{try{return JSON.parse($('embeddedConfig').textContent||'{}')}catch{return {}}})();
const REVISION=/^[a-z0-9-]{1,80}$/i.test(EMBEDDED.revision||'')?EMBEDDED.revision:'builtin-v11';
const KEY={data:'survey-editor-v1:data',db:'survey-editor-v1:db:'+REVISION,split:'survey-editor-v1:preview-height',zoom:'survey-editor-v1:preview-zoom'};
// 雲端權杖與道路表編輯器共用（同一網站時免重新輸入）；記住密碼的鍵名則分開，避免互相清除。
const CLOUD_KEY='road-editor-cloud:v1',CLOUD_DIR='會勘紀錄',CLOUD_LIB='資料庫/會勘資料庫.json',UNLOCK_KEY='survey-editor-unlock:v1';
const ls={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch{return false}},del(k){try{localStorage.removeItem(k)}catch{}}};

const TRIP_TYPES={visit:'一般場所',hsr_depart:'高鐵／機場出發',hsr_arrive:'高鐵／機場抵達站'};
const TYPES={...TRIP_TYPES,air_depart:TRIP_TYPES.hsr_depart,air_arrive:TRIP_TYPES.hsr_arrive};
const RAIL_CAR6_PEOPLE=[['永和','railSeat6Yonghe'],['泰安','railSeat6Taian'],['座官','railSeat6Officer'],['幹部','railSeat6Cadre']];
const RAIL_SEAT_EXCLUDED=new Set([]);
const CITIES=['臺北市','新北市','桃園市','臺中市','臺南市','高雄市','基隆市','新竹市','嘉義市','宜蘭縣','新竹縣','苗栗縣','彰化縣','南投縣','雲林縣','嘉義縣','屏東縣','臺東縣','花蓮縣','澎湖縣','金門縣','連江縣'];
const COMMON_PLACE_NAMES=['敦南寓所','公保大樓','陽明寓所'];
const AIRPORT_PLACES=[{name:'松山機場',city:'臺北市',aliases:['松山軍用機場','臺北松山機場','台北松山機場']},{name:'台東機場',city:'臺東縣',aliases:['臺東機場']},{name:'澎湖機場',city:'澎湖縣',aliases:[]}];
const HSR_CITIES={'高鐵南港站':'臺北市','高鐵臺北站':'臺北市','高鐵板橋站':'新北市','高鐵桃園站':'桃園市','高鐵新竹站':'新竹縣','高鐵苗栗站':'苗栗縣','高鐵臺中站':'臺中市','高鐵彰化站':'彰化縣','高鐵雲林站':'雲林縣','高鐵嘉義站':'嘉義縣','高鐵臺南站':'臺南市','高鐵左營站':'高雄市'};
const cityName=v=>String(v||'').trim().replace(/台/g,'臺');
function guessCity(name,address=''){const known={...HSR_CITIES,...Object.fromEntries(AIRPORT_PLACES.map(p=>[canon(p.name),p.city])),'敦南寓所':'臺北市','陽明寓所':'臺北市','公保大樓':'臺北市','岡山軍用機場':'高雄市','松山軍用機場':'臺北市'};return known[canon(name)]||CITIES.find(c=>cityName(address).includes(c))||''}
const tripRole=s=>s.type.replace(/^air_/,'hsr_');
function setTripRole(s,role){const air=/機場$/.test(canon(s.place))||(!s.place.trim()&&s.type.startsWith('air_'));s.type=role==='visit'?'visit':role.replace(/^hsr_/,air?'air_':'hsr_')}

const LEG_MODES={car:'車行',walk:'步行',none:'不列'};
const TONES=['','red','blue','green','black'];
const HEX={blue:'0000FF',red:'EE0000',green:'006600'};
const LINE_KINDS={rites:[['step','步驟'],['note','※'],['pre','說明']],notes:[['note','※'],['contact','聯絡'],['pre','一般']]};
const PT=724/522; // 預覽：表格寬 522pt 對應 724px

// ── 常用資料庫預設值（可在「常用資料庫」修改，並以「匯出已校訂 HTML」寫回檔案）──
const DEFAULT_DB={
  kind:'survey-editor-database',version:1,history:[],
  settings:{prepLead:15,origin:'敦南寓所',escort:''},escorts:[],
  shortNames:[['敦南寓所','敦南'],['陽明寓所','陽明'],['公保大樓','公保']],
  members:[],
  residence:[],
  advance:[],
  hsr:{'高鐵南港站':'','高鐵臺北站':'','高鐵板橋站':'','高鐵桃園站':'','高鐵新竹站':'','高鐵苗栗站':'','高鐵臺中站':'','高鐵彰化站':'','高鐵雲林站':'','高鐵嘉義站':'','高鐵臺南站':'','高鐵左營站':''},
  regions:['台北','新北','桃園','新竹','苗栗','台中','彰化','南投','雲林','嘉義','台南','高雄','屏東','宜蘭','花蓮','台東','基隆','澎湖','金門'],
  attire:['勤務衫','休閒襯衫','便服','西裝','輕便服'],
  prepLabels:['場檢','部署','重點','全員','場部'],
  ritePhrases:['蒞臨(…恭迎)','步行進入…','搭乘電梯至…樓','致詞(約…分)','合影1梯次(合影畢返座)','就座','頒獎予…','導覽(全程由…導覽)','恭送。','※備「高鐵站貴賓室」'],
  notePhrases:['空車隊？','控梯：','備用貴賓室？廁所？','致詞時使用講桌及手持麥克風。踏墊？','就座時保留席1席','安排並提供主桌座次','各講者時間提醒？','場內媒體區？場外媒體區？','準備手套、溼紙巾','門票？'],
  contactRoles:['主辦','競辦','聯絡人','對口'],
  places:[
    {name:'高鐵臺北站',rites:[{kind:'note',text:'備「高鐵站貴賓室」'}]},
    {name:'高鐵左營站',rites:[{kind:'note',text:'備「高鐵站貴賓室」'}]},
    ...AIRPORT_PLACES.map(p=>({name:p.name,city:p.city}))
  ]
};

const IMPORTED_HSR_NAMES=["高鐵南港站","高鐵臺北站","高鐵板橋站","高鐵桃園站","高鐵新竹站","高鐵苗栗站","高鐵臺中站","高鐵彰化站","高鐵雲林站","高鐵嘉義站","高鐵臺南站","高鐵左營站"];
function importHsrNames(db){
  if(db.hsrNamesRevision>=1)return db;
  const names=new Set(db.places.map(p=>canon(p.name)));
  for(const name of IMPORTED_HSR_NAMES){if(names.has(canon(name)))continue;db.places.push(normalizePlace({name}));names.add(canon(name))}
  db.hsrNamesRevision=1;return db;
}

  if(s.advance.length){const names=s.advance.map((nm,k)=>k===0&&s.advancePhone?nm+advancePhone(nm):nm);ps.push(P([R('先遣：'),R(names.join('、'))],{jc:'left',line:240,gap:1}));prev='advance'}
  if(isRail(s)&&s.deputyOn){ps.push(P(richRuns(`${stationShort(s.place)}值班副站長：${hsrPhone(s.place)||'？'}`,{c:'green'}),{jc:'left',line:240,gap:prev?0:1}));prev='deputy'}
  for(const l of s.notes){
    if(!l.text.trim())continue;
    const c=lineColor('notes',l),b=lineBold('notes',l),gap=l.kind==='note'||l.kind!==prev?1:0;
    if(l.kind==='note')ps.push(P([R('※',b,c),...richRuns(l.text.replace(/^※\s*/,''),{b,c})],{jc:'left',line:240,gap,hang:240}));
    else ps.push(P(richRuns(l.text,{b,c}),{jc:'left',line:240,gap}));
    prev=l.kind;
  }
  return ps;
}
function buildModel(){
  const g=state.global,st=state.stops,rows=[];
  rows.push({kind:'title',id:'global',paras:[P(richRuns(rocDateText()+'勤務會勘紀錄表',{b:true}),{line:240}),P(richRuns(weatherText(),{b:true,c:'blue'}),{line:240})]});
  rows.push({kind:'head'});
  rows.push({kind:'cells',id:'global',cells:[[P([R(q(departOf())+'離',true)],{line:300})],[P(richRuns(q(g.origin),{b:true}),{line:300})],[P([],{line:300})],[P([R(q(prepOf())+'備車',true)],{line:300})]]});
  const first=st[0],firstRuns=first&&!hasLegRow(first)?[]:legRuns(first?.legMode||'car',first?.legMinutes||'');
  if(firstRuns.length&&g.escortOn&&String(g.escort).trim())firstRuns.push(R('('),R('座車隨行-'+g.escort.trim(),false,'blue'),R(')'));
  const crew=[];if(g.crew.length||g.residence.length){crew.push(R('本隊：',true),R(g.crew.join('、')||'？'));if(g.residence.length)crew.push(R('；寓所：',true),R(g.residence.join('、')))}
  const firstParas=[...(firstRuns.length?[P(firstRuns,{line:300})]:[]),...(crew.length?[P(crew,{line:300})]:[])];
  if(firstParas.length)rows.push({kind:'span',id:'global',shade:'F2F2F2',paras:firstParas});
  st.forEach((s,i)=>{
    if(i>0&&hasLegRow(s))rows.push({kind:'span',id:s.id,paras:[P(legRuns(s.legMode,s.legMinutes),{line:320})]});
    const row={kind:'cells',id:s.id,cells:[timeCell(i),placeCell(i),ritesCell(i),notesCell(i)]};
    const prevRow=rows[rows.length-1];
    // 機場出發與抵達相鄰、且抵達站沒有儀節時，儀節欄上下合併（同原表「飛行時間 50 分鐘」）
    if(s.type==='air_arrive'&&pairOf(i)&&!s.rites.some(l=>l.text.trim())&&prevRow?.id===st[i-1].id&&prevRow.kind==='cells'){prevRow.vmerge={2:'restart'};row.vmerge={2:'cont'}}
    rows.push(row);
  });
  const rt=returnTimeOf();
  rows.push({kind:'span',id:'global',paras:[P([...legRuns('car',g.returnMinutes),R('(',true),R((rt||'？')+'時',false,rt?'blue':'red'),R('返'+q(shortName(g.returnTo))),R(')',true)],{line:320})]});
  return rows;
}

// ── 待確認事項 ──
function errors(){
  const e=[],g=state.global,st=state.stops;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(g.date))e.push('勤務日期尚未填寫');
  const miss=[['region','地區'],['rain','降雨機率'],['attire','服裝']].filter(([k])=>!String(g[k]).trim()).map(([,l])=>l);
  if(!g.tempLow&&!g.tempHigh)miss.splice(1,0,'氣溫');
  if(miss.length)e.push('天氣列尚缺：'+miss.join('、'));
  if(!timeValid(departOf()))e.push('需首站抵達時間與紀錄原有的首段車行分鐘，才能反推出發時間');
  if(!g.crew.length)e.push('尚未選擇本隊人員');
  if(!st.length)e.push('尚未新增場所');
  st.forEach((s,i)=>{
    const n=`${pad2(i+1)} ${s.place.trim()||'未命名'}`;
    if(!s.place.trim())e.push(n+'：尚未填寫場所名稱');
    if(!timeValid(arriveOf(i)))e.push(n+'：缺少抵達時間');
    for(const [k,l] of [['arrive','抵達'],['depart','離開'],['trainArr','高鐵抵達']])if(s[k]&&!timeValid(s[k]))e.push(n+`：${l}時間格式不正確`);
    if(hasLegRow(s)&&minutesOf(s.legMinutes)===null)e.push(n+(i?'：缺少可推算車行時間的行程時刻':'：紀錄未含首段車行分鐘'));
    const mm=timeMismatch(i);if(mm)e.push(n+`：抵達 ${s.arrive} 與推算 ${mm} 不符`);
    if(timeValid(arriveOf(i))&&timeValid(s.depart)&&s.depart<arriveOf(i)&&!(s.depart<'0300'))e.push(n+'：離開時間早於抵達時間');
    if(s.type==='hsr_depart'&&!arrivalFor(i))e.push(n+'：下一筆應為對應的抵達站');
    if(s.type==='hsr_arrive'&&!s.trainNo.trim())e.push(n+'：尚未填寫車次');
    if(isArriveType(s)&&!pairOf(i))e.push(n+'：前一筆不是對應的出發站');
    if(s.type==='air_depart'&&!arrivalFor(i))e.push(n+'：下一筆應為對應的抵達站');
    if(isRail(s)&&s.deputyOn&&!hsrPhone(s.place))e.push(n+'：資料庫沒有此站副站長電話');
    const qn=qMarks(s);
    const red=s.notes.filter(l=>l.text.trim()&&lineColor('notes',l)==='red').length;
    if(qn||red)e.push(n+`：${qn?`「？」${qn} 處`:''}${qn&&red?'、':''}${red?`紅字待確認 ${red} 項`:''}`);
  });
  if(minutesOf(g.returnMinutes)===null)e.push('返程車行時間尚未填寫');
  return e;
}
function qMarks(s){return ([s.place,s.placeLines,s.event,s.address,...s.rites.map(l=>l.text),...s.notes.map(l=>l.text)].join('\n').match(/[？?]+/g)||[]).length}
function pendingCounts(){let qn=0,red=0;for(const s of state.stops){qn+=qMarks(s);red+=s.notes.filter(l=>l.text.trim()&&lineColor('notes',l)==='red').length}return {qn,red}}

  if(!s.placeLines.trim()&&p.placeLines){s.placeLines=p.placeLines;changed=true}

    <div class="db-edit">${p?`<div class="grid-2"><label class="field"><span>場所名稱</span><input id="dbpName" value="${esc(p.name)}" readonly></label><label class="field"><span>縣市</span><select id="dbpCity" disabled>${cityOptions(p.city,'未分類')}</select></label></div>${/^高鐵/.test(p.name)?`<label class="field"><span>值班副站長電話</span><input id="dbpDeputy" data-db-hsr="${esc(p.name)}" value="${esc(hsrPhone(p.name))}" placeholder="09xx-xxxxxx"></label>`:`<div class="grid-2"><label class="field"><span>地址（可換行）</span><textarea id="dbpAddress">${esc(p.address)}</textarea></label><label class="field"><span>場所其他行（樓層、廳別）</span><textarea id="dbpLines">${esc(p.placeLines)}</textarea></label></div>`}<label class="field"><span>儀節預設行（「※」開頭為附註、「1.」開頭為步驟）</span><textarea id="dbpRites">${esc(serializeLines(p.rites,'rites'))}</textarea></label><label class="field"><span>注意事項預設行（「※」開頭為待確認事項、含電話者為聯絡人）</span><textarea id="dbpNotes">${esc(serializeLines(p.notes,'notes'))}</textarea></label><div class="db-save-row"><button type="button" class="primary" id="dbpSave">儲存此場所</button></div><p class="hint">新增場所或輸入場所名稱後，空白的地址、樓層、儀節與注意事項會自動帶入；已手動填寫的內容不會被覆蓋。</p>`:'<p class="empty-hint">請從左側選擇或新增常用場所。也可以在行程填好後按頁首的「場所存至資料庫」。</p>'}</div></div>`;
  }else if(dbTab==='history'){
    c.innerHTML=historyMarkup();
  }else if(dbTab==='people'){
    c.innerHTML=`<div class="db-grid"><label class="field"><span>本隊人員（每行一人，依此順序輸出）</span><textarea data-db-list="members">${esc(lines2text(DB.members))}</textarea></label><label class="field"><span>寓所人員（每行一人，依此順序輸出）</span><textarea data-db-list="residence">${esc(lines2text(DB.residence))}</textarea></label><label class="field"><span>先遣人員（每行「姓名 電話」）</span><textarea data-db-advance>${esc(DB.advance.map(a=>(a.name+' '+a.phone).trim()).join('\n'))}</textarea></label><div class="field"><label class="field"><span>座車隨行選項（每行一人，可新增）</span><textarea data-db-list="escorts">${esc(lines2text(DB.escorts))}</textarea></label><span>座車隨行預設（新增紀錄時套用）</span><select data-db-setting="escort"><option value="">不預設</option>${DB.escorts.map(n=>`<option value="${esc(n)}" ${DB.settings.escort===n?'selected':''}>${esc(n)}</option>`).join('')}</select><span style="margin-top:10px">預設出發／返抵場所</span><input data-db-setting="origin" value="${esc(DB.settings.origin||'')}" list="placeList"></div></div>`;
  }else if(dbTab==='phrases'){
    const box=(k,l)=>`<label class="field"><span>${l}</span><textarea data-db-list="${k}">${esc(lines2text(DB[k]))}</textarea></label>`;
    c.innerHTML=`<p class="hint">每行一項。片語中的「…」會在插入後自動選取，方便直接改寫；以「※」開頭的儀節片語會加成附註。</p><div class="db-grid">${box('ritePhrases','儀節片語')}${box('notePhrases','注意事項片語')}${box('contactRoles','聯絡人稱謂')}${box('prepLabels','場部時間名稱')}${box('attire','服裝選項')}${box('regions','地區選項')}</div>`;
  }else{
    c.innerHTML=`<div class="db-grid"><label class="field"><span>備車提前（分鐘）</span><input data-db-setting="prepLead" value="${esc(DB.settings.prepLead)}" inputmode="numeric"></label><label class="field"><span>場所簡稱（每行「全名=簡稱」，用於「返敦南」）</span><textarea data-db-short>${esc(DB.shortNames.map(([a,b])=>a+'='+b).join('\n'))}</textarea></label></div>`;
  }
}
for(const b of document.querySelectorAll('[data-db-tab]'))b.onclick=()=>{dbTab=b.dataset.dbTab;dbRender()};
$('databaseBtn').onclick=openDatabase;$('dbClose').onclick=()=>{$('dbDialog').close();render()};
$('dbContent').addEventListener('toggle',e=>{if(e.target.dataset.dbGroup)dbGroupOpen.set(e.target.dataset.dbGroup,e.target.open)},true);
$('dbContent').addEventListener('input',e=>{if(e.target.id==='historySearch'){historyQuery=e.target.value;historyPage=0;const pos=e.target.selectionStart;dbRender();const el=$('historySearch');el.focus();el.setSelectionRange(pos,pos);return}if(e.target.id==='dbSearch'){dbSearch=e.target.value;const pos=e.target.selectionStart;dbRender();const s=$('dbSearch');s.focus();s.setSelectionRange(pos,pos)}});
$('dbContent').addEventListener('change',e=>{
  const el=e.target;if(el.id==='historyDateFilter'){historyDateQuery=el.value;historyPage=0;dbRender();return}let done=true;
  if(el.dataset.dbList){const v=text2lines(el.value);DB[el.dataset.dbList]=['members','residence','escorts'].includes(el.dataset.dbList)?[...new Set(v)]:v}
  else if('dbAdvance' in el.dataset)DB.advance=text2lines(el.value).map(t=>{const m=t.match(/^(.+?)\s*(0[\d-]{6,})?$/);return {name:(m?.[1]||t).trim(),phone:(m?.[2]||'').trim()}});
  else if(el.dataset.dbSetting)DB.settings[el.dataset.dbSetting]=el.dataset.dbSetting==='prepLead'?(minutesOf(el.value)??15):el.value.trim();
  else if(el.dataset.dbHsr)DB.hsr[el.dataset.dbHsr]=el.value.trim();
  else if('dbShort' in el.dataset)DB.shortNames=text2lines(el.value).map(t=>t.split(/[=＝]/).map(x=>x.trim())).filter(p=>p[0]).map(p=>[p[0],p[1]||p[0]]);
  else done=false;
  if(done){if(el.dataset.dbList==='escorts'){if(!DB.escorts.includes(DB.settings.escort))DB.settings.escort=DB.escorts[0]||'';dbRender()}saveDB();dbStatus('已儲存（本機）。要寫回 HTML 檔請按「匯出已校訂 HTML」。')}
});
$('dbContent').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.historyId){historySelection=b.dataset.historyId;historyDraft=null;dbRender();return}
  if(b.dataset.historyPage){historyPage+=Number(b.dataset.historyPage);dbRender();return}
  if(b.dataset.historyAction){const action=b.dataset.historyAction;
    if(action==='new'){historyDraft=normalizeHistoryRecord({id:uid(),date:state.global.date,name:'新地點',stop:{place:'新地點'}});historyDraft.name='';historyDraft.stop.place='';historySelection='new';dbRender();$('historyName').focus()}
    if(action==='archive')archiveDutyHistory();
    if(action==='save')saveHistoryForm();
    if(action==='use')addHistoryToTrip(historySelection);
    if(action==='delete'){const r=DB.history.find(r=>r.id===historySelection);if(r)ask('刪除歷年勤務地點？','刪除「'+historyDateText(r.date)+' '+r.name+'」？',()=>{DB.history=DB.history.filter(x=>x.id!==r.id);historySelection=null;saveDB();dbRender();dbStatus('已刪除')},'刪除')}
    return;
  }
  if(b.dataset.dbPlace){dbPlaceId=b.dataset.dbPlace;dbRender();return}
  if(b.id==='dbAddPlace'){const p=normalizePlace({name:'新場所'});DB.places.unshift(p);dbPlaceId=p.id;saveDB();dbRender();$('dbpName').select();return}
  if(b.id==='dbpSave'){const p=DB.places.find(x=>x.id===dbPlaceId);if(!p)return;const name=$('dbpName').value.trim();if(!name){dbStatus('場所名稱不可空白');return}const dup=DB.places.find(x=>x!==p&&canon(x.name)===canon(name));if(dup){dbStatus('已有同名場所：'+name);return}if(![...COMMON_PLACE_NAMES,...IMPORTED_HSR_NAMES].includes(name)){dbStatus('常用場所保留臺北市三個場所及全臺高鐵站');return}Object.assign(p,{name,city:COMMON_PLACE_NAMES.includes(name)?'臺北市':guessCity(name,p.address),address:$('dbpAddress')?.value??p.address,placeLines:$('dbpLines')?.value??p.placeLines,rites:parseLinesText($('dbpRites').value,'rites'),notes:parseLinesText($('dbpNotes').value,'notes')});if(/^高鐵/.test(name))DB.hsr[name]=$('dbpDeputy').value.trim();saveDB();dbRender();dbStatus('已儲存「'+name+'」');return}
  if(b.id==='dbpDelete'){const p=DB.places.find(x=>x.id===dbPlaceId);if(!p)return;$('dbDialog').close();ask('刪除常用場所？',`確定刪除「${p.name}」？`,()=>{DB.places=DB.places.filter(x=>x!==p);dbPlaceId=null;saveDB();openDatabase();dbStatus('已刪除')},'刪除');$('cancelConfirm').addEventListener('click',()=>openDatabase(),{once:true})}
});
$('dbHtmlExport').onclick=exportCalibratedHTML;
$('dbExport').onclick=()=>{download(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),`會勘資料庫_${today()}.json`);dbStatus('已下載資料庫備份')};
$('dbImport').onclick=()=>$('dbFile').click();
$('dbFile').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=JSON.parse(await f.text());if(d?.kind!=='survey-editor-database')throw Error('不是會勘資料庫備份');DB=normalizeDB(d);saveDB();dbPlaceId=null;dbRender();dbStatus(`已匯入：常用場所 ${DB.places.length} 筆`)}catch(err){dbStatus('匯入失敗：'+err.message)}});

// ── 雲端儲存：透過 GitHub API 讀寫私人 repo（權杖只存在本機瀏覽器）──
let cloudCfg=(()=>{try{return JSON.parse(ls.get(CLOUD_KEY)||'{}')||{}}catch{return {}}})(),cloudFiles=[],cloudBusy=false;
const cloudReady=()=>!!(cloudCfg.token&&cloudCfg.repo);
function cloudStatus(s){$('cloudStatus').textContent=s||''}
function cloudStoreCfg(){ls.set(CLOUD_KEY,JSON.stringify(cloudCfg));$('cloudBtn').classList.toggle('cloud-on',cloudReady())}
function cloudB64(text){const bytes=new TextEncoder().encode(text);let bin='';for(let i=0;i<bytes.length;i+=8192)bin+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(bin)}
const cloudSize=n=>n>=1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
async function cloudApi(path,opt={}){
  if(!cloudReady())throw Error('請先在「連線設定」貼上權杖');
  const url='https://api.github.com/repos/'+cloudCfg.repo+(path===null?'':'/contents/'+path.split('/').map(encodeURIComponent).join('/'));let res;
  try{res=await fetch(url,{method:opt.method||'GET',cache:'no-store',headers:{Authorization:'Bearer '+cloudCfg.token,Accept:opt.raw?'application/vnd.github.raw+json':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})},body:opt.body?JSON.stringify(opt.body):undefined})}catch{throw Error('網路連線失敗，請確認可以連上網路')}
  if(res.ok)return opt.raw?res.text():res.status===204?null:res.json();
  let msg='';try{msg=(await res.json()).message||''}catch{}
  const err=Error(res.status===401?'權杖無效或已過期，請重新產生權杖':res.status===404?(path===null?'找不到資料 repo，或權杖沒有這個 repo 的權限':'雲端找不到這個檔案'):res.status===409?'雲端檔案已在其他裝置更新，請按「重新整理」後再試':res.status===403?(/rate limit/i.test(msg)?'GitHub 使用次數暫時超過上限，請稍後再試':'權杖沒有寫入權限（Contents 需設為 Read and write）'):'GitHub 回應錯誤 '+res.status+(msg?'：'+msg:''));
  err.status=res.status;throw err;
}
async function cloudRun(label,fn){if(cloudBusy)return;cloudBusy=true;for(const b of $('cloudDialog').querySelectorAll('button:not(#cloudClose)'))b.disabled=true;cloudStatus(label+'…');try{await fn()}catch(e){cloudStatus(label+'失敗：'+e.message)}finally{cloudBusy=false;for(const b of $('cloudDialog').querySelectorAll('button'))b.disabled=false;cloudRenderState()}}
function cloudRenderState(){const ready=cloudReady();for(const id of ['cloudSaveTrip','cloudUploadFiles','cloudRefresh','cloudUpLib','cloudDownLib'])$(id).disabled=!ready||cloudBusy;$('cloudForget').disabled=!cloudCfg.token||cloudBusy;$('cloudLock').hidden=!ls.get(UNLOCK_KEY)}
function cloudListRender(){if(!cloudReady()){$('cloudList').innerHTML='<div class="cloud-empty">尚未連線。請先展開「連線設定」貼上權杖。</div>';return}$('cloudList').innerHTML=cloudFiles.length?cloudFiles.map(f=>`<div class="cloud-row"><span class="cloud-name" title="${esc(f.name)}">${esc(f.name.replace(/\.json$/i,''))}</span><span class="cloud-size">${cloudSize(f.size)}</span><button type="button" class="small" data-cloud-load="${esc(f.name)}">讀取</button><button type="button" class="small danger" data-cloud-del="${esc(f.name)}">刪除</button></div>`).join(''):'<div class="cloud-empty">雲端還沒有會勘 JSON。</div>'}
async function cloudLoadList(){try{const items=await cloudApi(CLOUD_DIR);cloudFiles=(Array.isArray(items)?items:[]).filter(f=>f.type==='file'&&/\.json$/i.test(f.name)).map(f=>({name:f.name,path:f.path,sha:f.sha,size:f.size})).sort((a,b)=>b.name.localeCompare(a.name,'zh-Hant'))}catch(e){if(e.status===404){await cloudApi(null);cloudFiles=[]}else throw e}cloudListRender()}
const cloudPut=(path,text,message,sha)=>cloudApi(path,{method:'PUT',body:{message,content:cloudB64(text),...(sha?{sha}:{})}});
async function cloudSaveTrip(){
  persist();const name=(safeFileName(state.name)||'會勘紀錄表')+'.json',text=JSON.stringify(state,null,2);
  await cloudRun('讀取雲端清單',cloudLoadList);const existing=cloudFiles.find(f=>f.name===name);
  const doSave=()=>cloudRun('儲存紀錄',async()=>{const fresh=existing?await cloudApi(CLOUD_DIR+'/'+name).catch(e=>{if(e.status===404)return null;throw e}):null;await cloudPut(CLOUD_DIR+'/'+name,text,(fresh?'更新':'新增')+'會勘紀錄：'+name,fresh?.sha);await cloudLoadList();cloudStatus('已儲存到雲端：'+name);notify('已儲存到雲端：'+name)});
  if(existing){$('cloudDialog').close();ask('覆蓋雲端紀錄？',`雲端已有「${name}」，要以目前內容覆蓋嗎？（GitHub 會保留舊版本紀錄）`,()=>{$('cloudDialog').showModal();doSave()},'覆蓋')}else await doSave();
}
for(const [id,fn] of Object.entries({
  cloudConnect:()=>{cloudCfg={token:$('cloudToken').value.trim(),repo:$('cloudRepo').value.trim().replace(/^https:\/\/github\.com\//,'').replace(/\/$/,'')};cloudStoreCfg();cloudRun('測試連線',async()=>{await cloudApi(null);await cloudLoadList();await cloudLibInfo();$('cloudSetup').open=false;cloudStatus('連線成功')})},
  cloudForget:()=>{cloudCfg={repo:cloudCfg.repo};cloudStoreCfg();$('cloudToken').value='';cloudFiles=[];cloudListRender();cloudRenderState();cloudStatus('已清除此裝置的權杖')},
  cloudSaveTrip:()=>cloudSaveTrip(),
  cloudRefresh:()=>cloudRun('重新整理',async()=>{await cloudLoadList();await cloudLibInfo();cloudStatus('')}),
  cloudUploadFiles:()=>$('cloudFileInput').click(),
  cloudUpLib:()=>cloudRun('上傳資料庫',async()=>{const meta=await cloudLibInfo();await cloudPut(CLOUD_LIB,JSON.stringify({kind:'survey-editor-cloud-library',version:1,savedAt:new Date().toISOString(),database:DB}),'更新會勘資料庫',meta?.sha);await cloudLibInfo();cloudStatus(`已上傳資料庫：常用場所 ${DB.places.length} 筆`)}),
  cloudDownLib:()=>cloudRun('下載資料庫',async()=>{const d=JSON.parse(await cloudApi(CLOUD_LIB,{raw:true}));if(d?.kind!=='survey-editor-cloud-library')throw Error('雲端檔案不是會勘資料庫');const db=normalizeDB(d.database),when=d.savedAt?new Date(d.savedAt).toLocaleString('zh-TW',{hour12:false}):'未知';$('cloudDialog').close();ask('以雲端資料庫取代本機？',`雲端版本（${when}）：常用場所 ${db.places.length} 筆。本機目前 ${DB.places.length} 筆，將被取代。`,()=>{DB=db;saveDB();render();notify('已套用雲端資料庫')},'取代')}),
  cloudLock:()=>{ls.del(UNLOCK_KEY);cloudRenderState();cloudStatus('已鎖定：下次開啟需重新輸入密碼')},
  cloudClose:()=>$('cloudDialog').close()
}))$(id).onclick=fn;
async function cloudLibInfo(){try{const meta=await cloudApi(CLOUD_LIB);$('cloudLibInfo').textContent='雲端資料庫：'+cloudSize(meta.size);return meta}catch(e){if(e.status===404){$('cloudLibInfo').textContent='雲端還沒有會勘資料庫，請先上傳一次。';return null}throw e}}
$('cloudList').addEventListener('click',e=>{
  const load=e.target.closest('[data-cloud-load]'),del=e.target.closest('[data-cloud-del]');
  if(load)cloudRun('讀取紀錄',async()=>{const name=load.dataset.cloudLoad,text=await cloudApi(CLOUD_DIR+'/'+name,{raw:true});$('cloudDialog').close();await loadJsonFile(new File([text],name,{type:'application/json'}))});
  if(del){const f=cloudFiles.find(x=>x.name===del.dataset.cloudDel);if(!f)return;$('cloudDialog').close();ask('刪除雲端紀錄？',`確定刪除雲端的「${f.name}」？（GitHub 仍會保留歷史版本）`,()=>{$('cloudDialog').showModal();cloudRun('刪除',async()=>{await cloudApi(f.path,{method:'DELETE',body:{message:'刪除會勘紀錄：'+f.name,sha:f.sha}});await cloudLoadList();cloudStatus('已刪除：'+f.name)})},'刪除')}
});
$('cloudFileInput').addEventListener('change',e=>{const files=[...e.target.files];e.target.value='';if(!files.length)return;cloudRun('上傳 JSON',async()=>{await cloudLoadList();let n=0;for(const f of files){const text=await f.text();const d=JSON.parse(text);if(!Array.isArray(d?.stops))throw Error(f.name+' 不是會勘紀錄 JSON');const name=safeFileName(f.name.replace(/\.json$/i,''))+'.json',old=cloudFiles.find(x=>x.name===name);await cloudPut(CLOUD_DIR+'/'+name,text,'上傳會勘紀錄：'+name,old?.sha);n++}await cloudLoadList();cloudStatus(`已上傳 ${n} 個檔案`)})});
$('cloudBtn').onclick=()=>{$('cloudToken').value=cloudCfg.token||'';$('cloudRepo').value=cloudCfg.repo||'comfort527/road-table-data';$('cloudSetup').open=!cloudReady();cloudStatus('');cloudRenderState();cloudListRender();$('cloudDialog').showModal();if(cloudReady())cloudRun('讀取雲端清單',async()=>{await cloudLoadList();await cloudLibInfo();cloudStatus('')})};

// ── 啟動 ──
cloudStoreCfg();renderDatalists();render();
if(!state.stops.length&&!ls.get(KEY.data))notify('可按「載入示範」看看完整範例');

</script></body></html>
